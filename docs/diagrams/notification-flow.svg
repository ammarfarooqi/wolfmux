<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 770" width="1280" height="770" role="img" aria-labelledby="title desc">
<title id="title">Wolfmux: A notification that leads back to the team</title>
<desc id="desc">Sequence: an agent finishes a turn and Claude Code fires its Stop hook, teamctl _notify. teamctl takes the first line of the agent's last message, removes control characters, asks tmux which terminals are attached to the team, and writes an OSC 9 notification to the tty of each capable terminal. The terminal posts the notification, so clicking it brings the tab with the team to the front. With no terminal attached, the fallback is osascript with a hint to run teamctl attach.</desc>
