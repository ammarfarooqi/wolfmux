<text class="sans" x="48" y="58" font-size="13" font-weight="700" letter-spacing="3" fill="#f5b942">WOLFMUX · NOTIFICATIONS</text>
<text class="sans text" x="48" y="94" font-size="28" font-weight="700">A notification that leads back to the team</text>
<text class="sans muted" x="48" y="122" font-size="15">Inside tmux the usual notifiers fall back to osascript, and macOS files those under Script Editor. teamctl sends its own.</text>
