<text class="sans muted" x="48" y="708" font-size="13">Nothing attached (detached team, or a terminal without OSC 9): osascript, with "open it with: teamctl attach". The ECC plugin's own notifier is switched off inside team agents.</text>
<text class="sans muted" x="48" y="730" font-size="13">WOLFMUX_NOTIFY = all (default) · lead · off</text>
