<g class="mono">
  <!-- pane titles sit on the border, as tmux draws them -->
  <rect x="470" y="95" width="156" height="18" fill="#0d1526"/><text class="amber" x="476" y="109" font-weight="700">🐺 lead · Fable 5.2</text>
  <rect x="894" y="95" width="166" height="18" fill="#0d1526"/><text class="muted" x="900" y="109">🐶 backend · GLM-5.3</text>
  <rect x="894" y="247" width="174" height="18" fill="#0d1526"/><text class="muted" x="900" y="261">🐶 frontend · GLM-5.3</text>
  <rect x="894" y="399" width="172" height="18" fill="#0d1526"/><text class="muted" x="900" y="413">🐶 qa · GLM-5.3 Flash</text>

  <!-- lead -->
  <text class="text" x="470" y="142">› Ship the cart API. Split it across the pack.</text>
  <text x="470" y="172"><tspan class="amber">⏺</tspan><tspan class="ice"> bd create "API: cart" -a backend</tspan></text>
  <text x="470" y="194"><tspan class="amber">⏺</tspan><tspan class="ice"> bd create "Cart UI" -a frontend --deps shop-12</tspan></text>
  <text x="470" y="216"><tspan class="amber">⏺</tspan><tspan class="ice"> teamctl spawn qa flash</tspan></text>
  <text class="faint" x="486" y="238">⎿ qa · GLM-5.3 Flash · ai/qa-0920-1402</text>
  <text class="muted" x="470" y="276">[wolfmux] Beads update for lead (shop-12)</text>
  <text x="470" y="306"><tspan class="amber">⏺</tspan><tspan class="ice"> bd show shop-12</tspan></text>
  <text class="faint" x="486" y="328">⎿ closed by backend · commit 3f9c1e2 · tests pass</text>
  <text x="470" y="358"><tspan class="amber">⏺</tspan><tspan class="ice"> teamctl diff backend --stat</tspan></text>
  <text class="faint" x="486" y="380">⎿ 6 files changed, 212 insertions(+)</text>
  <text x="470" y="410"><tspan class="amber">⏺</tspan><tspan class="ice"> git merge --no-ff ai/backend-0920-1356</tspan></text>
  <text class="green" x="470" y="448">✓ cart API merged into main</text>
  <text class="green" x="470" y="470">✓ frontend unblocked · qa reported one flaky test</text>
  <text class="muted" x="470" y="526">⏵⏵ bypass permissions on</text>

  <!-- backend -->
  <text class="violet" x="894" y="140">[wolfmux] Beads update for backend</text>
  <text x="894" y="162"><tspan class="violet">⏺</tspan><tspan class="text"> bd update shop-12 --claim</tspan></text>
  <text x="894" y="184"><tspan class="violet">⏺</tspan><tspan class="text"> edit src/cart/routes.ts</tspan></text>
  <text x="894" y="206"><tspan class="violet">⏺</tspan><tspan class="text"> npm test</tspan><tspan class="faint">  ⎿ 48 passed</tspan></text>
  <text class="green" x="894" y="234">✓ bd close shop-12 · the lead was told</text>

  <!-- frontend -->
  <text class="violet" x="894" y="292">[wolfmux] Beads update for frontend</text>
  <text x="894" y="314"><tspan class="violet">⏺</tspan><tspan class="text"> bd show shop-13</tspan></text>
  <text class="faint" x="910" y="336">⎿ blocked by shop-12 · waiting</text>
  <text x="894" y="358"><tspan class="violet">⏺</tspan><tspan class="text"> edit app/cart/CartDrawer.tsx</tspan></text>
  <text class="muted" x="894" y="386">✳ Working… (42s)</text>

  <!-- qa -->
  <text class="violet" x="894" y="444">[wolfmux] Beads update for qa</text>
  <text x="894" y="466"><tspan class="violet">⏺</tspan><tspan class="text"> npx playwright test cart.spec.ts</tspan></text>
  <text class="faint" x="910" y="488">⎿ 12 passed · 1 flaky</text>
  <text x="894" y="510"><tspan class="violet">⏺</tspan><tspan class="text"> bd create "Flaky: coupon" -a lead</tspan></text>
  <text class="green" x="894" y="538">✓ reported to the lead</text>
</g>
