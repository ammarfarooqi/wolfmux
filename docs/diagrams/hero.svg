<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
<title id="title">Wolfmux: the lead on the left, three teammates stacked on the right</title>
<desc id="desc">On the left the Wolfmux wolf, wordmark and four properties. On the right a terminal with four tmux panes: the lead, marked with a wolf and an amber border, fills the left side; a backend, a frontend and a QA teammate, each marked with a dog and working on a Beads task, are stacked on the right.</desc>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; }
  .text { fill: #e6edf7; } .muted { fill: #8fa3c2; } .faint { fill: #5d7196; }
  .amber { fill: #f5b942; } .ice { fill: #7cc4ff; } .green { fill: #6ee7a8; } .violet { fill: #b69cff; } .coral { fill: #ff7a90; }
  .chip { fill: #111a2e; stroke: #26365a; stroke-width: 1.5; }
  .pane { fill: #0d1526; }
  .rule { stroke: #33456b; stroke-width: 1.5; }
  .rule-lead { stroke: #f5b942; stroke-width: 1.5; }
</style>
<defs>
  <radialGradient id="moon" cx="18%" cy="30%" r="60%">
    <stop offset="0" stop-color="#1b2a4d"/>
    <stop offset="1" stop-color="#0b1020"/>
  </radialGradient>
  <clipPath id="screen"><rect x="452" y="56" width="772" height="528" rx="14"/></clipPath>
</defs>

<rect width="1280" height="640" rx="24" fill="url(#moon)"/>

