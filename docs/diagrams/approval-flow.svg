<circle cx="152" cy="262" r="10" fill="#b69cff"/><text class="sans" x="152" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#0b1020">1</text>
<path d="M491 324 H799" fill="none" stroke="#7cc4ff" stroke-width="2" marker-end="url(#head-ice)"/>
