<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 748" width="1280" height="748" role="img" aria-labelledby="title desc">
<title id="title">Wolfmux: The lead decides a worker's permission request</title>
<desc id="desc">Sequence: a worker's Claude Code wants to run a command and fires its PermissionRequest hook, teamctl _permission-hook. The hook files request A7 atomically and tells the lead's pane. The lead runs teamctl approve A7 or teamctl deny A7 with a reason. The hook, which has been polling, returns the decision to the worker's CLI as JSON. If nobody answers before the timeout, the hook stays silent and the worker's normal prompt appears.</desc>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .text { fill: #e6edf7; } .muted { fill: #8fa3c2; } .faint { fill: #5d7196; }
</style>
<defs>
  <marker id="head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#f5b942"/></marker>
  <marker id="head-ice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7cc4ff"/></marker>
  <marker id="head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6ee7a8"/></marker>
  <marker id="head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#b69cff"/></marker>
  <marker id="head-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ff7a90"/></marker>
  <marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8fa3c2"/></marker>
</defs>
<rect width="1280" height="748" rx="24" fill="#0b1020"/>
<text class="sans" x="48" y="58" font-size="13" font-weight="700" letter-spacing="3" fill="#f5b942">WOLFMUX · ONE MANAGER</text>
<text class="sans text" x="48" y="94" font-size="28" font-weight="700">The lead decides a worker's permission request</text>
<text class="sans muted" x="48" y="122" font-size="15">Only with teamctl policy worker-permissions lead. The default is skip: agents run in their CLI's bypass mode and nothing is asked.</text>
