<text class="sans faint" x="640" y="343" text-anchor="middle" font-size="11.5">created atomically · ids never collide</text>
<circle cx="477" cy="324" r="10" fill="#7cc4ff"/><text class="sans" x="477" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#0b1020">2</text>
