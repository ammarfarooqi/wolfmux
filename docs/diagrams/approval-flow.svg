<rect x="651" y="359" width="303" height="19" rx="4" fill="#0b1020"/>
<text class="mono text" x="803" y="373" text-anchor="middle" font-size="12">[wolfmux] Permission request A7 from qa</text>
<rect x="707" y="392" width="192" height="17" rx="4" fill="#0b1020"/>
