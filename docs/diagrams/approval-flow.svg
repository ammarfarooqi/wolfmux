<rect x="453" y="516" width="374" height="17" rx="4" fill="#0b1020"/>
<text class="sans faint" x="640" y="529" text-anchor="middle" font-size="11.5">the hook polls · up to 600 s (WOLFMUX_APPROVAL_TIMEOUT)</text>
<circle cx="803" cy="510" r="10" fill="#8fa3c2"/><text class="sans" x="803" y="514" text-anchor="middle" font-size="11" font-weight="700" fill="#0b1020">5</text>
