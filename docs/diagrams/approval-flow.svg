<text class="mono text" x="315" y="559" text-anchor="middle" font-size="12">{"decision": {"behavior": "allow"}}   or   deny + the reason</text>
<circle cx="477" cy="572" r="10" fill="#7cc4ff"/><text class="sans" x="477" y="576" text-anchor="middle" font-size="11" font-weight="700" fill="#0b1020">6</text>
<rect x="48" y="617" width="440" height="32" rx="16" fill="#16213a" stroke="#b69cff" stroke-width="1.5"/>
<circle cx="66" cy="633" r="9" fill="#b69cff"/><text class="sans" x="66" y="637" text-anchor="middle" font-size="11" font-weight="700" fill="#0b1020">7</text>
<text class="sans text" x="84" y="637" font-size="12.5">the CLI runs the command, or tells the model why it may not</text>
<text class="sans muted" x="48" y="708" font-size="13">No answer in time: the hook prints nothing, so the worker's own prompt appears. A worker cannot approve, deny, stop, restart, destroy or change policy (exit 77).</text>
