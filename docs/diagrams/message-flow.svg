<rect x="596" y="483" width="332" height="19" rx="4" fill="#0b1020"/>
<text class="mono text" x="762" y="497" text-anchor="middle" font-size="12">bd show shop-12 · bd update shop-12 --claim</text>
<circle cx="1128" cy="510" r="10" fill="#b69cff"/><text class="sans" x="1128" y="514" text-anchor="middle" font-size="11" font-weight="700" fill="#0b1020">5</text>
<rect x="832" y="555" width="400" height="32" rx="16" fill="#16213a" stroke="#b69cff" stroke-width="1.5"/>
<circle cx="850" cy="571" r="9" fill="#b69cff"/><text class="sans" x="850" y="575" text-anchor="middle" font-size="11" font-weight="700" fill="#0b1020">6</text>
<text class="sans text" x="868" y="575" font-size="12.5">works and commits on ai/backend-… in its own worktree</text>
<path d="M1114 634 H400" fill="none" stroke="#b69cff" stroke-width="2" marker-end="url(#head-violet)"/>
<rect x="578" y="607" width="368" height="19" rx="4" fill="#0b1020"/>
<text class="mono text" x="762" y="621" text-anchor="middle" font-size="12">bd close shop-12 -r "commit 3f9c1e2; tests pass"</text>
<circle cx="1128" cy="634" r="10" fill="#b69cff"/><text class="sans" x="1128" y="638" text-anchor="middle" font-size="11" font-weight="700" fill="#0b1020">7</text>
<path d="M382 696 H156" fill="none" stroke="#6ee7a8" stroke-width="2" marker-end="url(#head-green)"/>
<rect x="108" y="669" width="332" height="19" rx="4" fill="#0b1020"/>
<text class="mono text" x="274" y="683" text-anchor="middle" font-size="12">on_close → beads-nudge → teamctl nudge lead</text>
<rect x="146" y="702" width="256" height="17" rx="4" fill="#0b1020"/>
<text class="sans faint" x="274" y="715" text-anchor="middle" font-size="11.5">the same path, in the other direction</text>
<circle cx="396" cy="696" r="10" fill="#6ee7a8"/><text class="sans" x="396" y="700" text-anchor="middle" font-size="11" font-weight="700" fill="#0b1020">8</text>
<rect x="48" y="741" width="407" height="32" rx="16" fill="#16213a" stroke="#f5b942" stroke-width="1.5"/>
<circle cx="66" cy="757" r="9" fill="#f5b942"/><text class="sans" x="66" y="761" text-anchor="middle" font-size="11" font-weight="700" fill="#0b1020">9</text>
<text class="sans text" x="84" y="761" font-size="12.5">teamctl diff backend · review · merge what it approves</text>
<text class="sans muted" x="48" y="832" font-size="13">Messages work the same way: bd create "Subject" -t message -a &lt;role&gt;. Worker to worker is allowed; every message is in Beads' history.</text>
</svg>
