<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 872" width="1280" height="872" role="img" aria-labelledby="title desc">
<title id="title">Wolfmux: A task goes out, a result comes back</title>
<desc id="desc">Sequence: the lead runs teamctl task for the backend worker. The task is written to the project's store, native sqlite or Beads. teamctl then files one notice line for backend in v1.23.0's inbox and spools the body for it. Nothing is typed into the pane unless the typing gates allow it. The worker's next tool call, prompt or turn end hands it the notice with the body attached. The worker claims the task, works in its own worktree and runs teamctl done, which comes back to the lead the same way. A Codex agent has no such hooks and gets the notice alone.</desc>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .text { fill: #e6edf7; } .muted { fill: #8fa3c2; } .faint { fill: #5d7196; }
</style>
