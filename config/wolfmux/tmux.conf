# wolfmux tmux configuration
#
# Loaded ONLY by the dedicated team server that teamctl starts:
#     tmux -L wolfmux -f ~/.config/wolfmux/tmux.conf ...
# Your normal tmux server and any ~/.tmux.conf are never modified. Delete this
# file (and ~/bin/teamctl) and nothing of it remains.

# Start from your own tmux configuration, if you ever create one.
if-shell '[ -r ~/.tmux.conf ]' 'source-file ~/.tmux.conf'
if-shell '[ -r ~/.config/tmux/tmux.conf ]' 'source-file ~/.config/tmux/tmux.conf'

# --- what a visible agent team needs -----------------------------------------
set -g mouse on                   # click to focus, drag borders to resize, wheel to scroll
set -g history-limit 100000       # large scrollback per agent
set -g focus-events on
set -sg escape-time 10            # TUIs (Claude Code, Codex) need a fast Escape

# Shift+Enter and friends inside agent TUIs.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm*:RGB'

# Pane titles are agent roles. TUIs may not overwrite them.
# The manager (role "lead") is the wolf: its mark in the title and an amber border,
# focused or not, so you can find it at a glance among any number of workers.
# Every teammate is a dog of the pack.
set -g pane-border-status top
set -g pane-border-format ' #{?#{==:#{@ai_role},lead},#[fg=colour214]🐺 ,#{?#{@ai_role},🐶 ,}}#{?pane_active,#[bold],}#{?#{@ai_role},#{@ai_role} · #{@ai_label},#{pane_title}}#[default]#{?pane_dead, — exited (#{pane_dead_status}),} '
set -g pane-border-style '#{?#{==:#{@ai_role},lead},fg=colour214,fg=colour244}'
set -g pane-active-border-style '#{?#{==:#{@ai_role},lead},fg=colour214,fg=colour39}'
set -g allow-set-title off
set -g allow-rename off
set -wg automatic-rename off

# An agent that exits keeps its pane and final output on screen.
#   teamctl restart <role>   start it again in the same pane
#   teamctl stop <role>      close the pane
set -g remain-on-exit on

# New panes and windows inherit the current pane's directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# Two extra keys; every tmux default stays as it is.
#   prefix T            put the panes back in the team's arrangement (teamctl layout)
#   prefix N            open the team's notices (teamctl inbox --all) in a popup, and
#                       clear the 📨 count in the status line on the left
# Why not prefix I: this file sources YOUR ~/.tmux.conf first (see the top), so every
# binding below comes later and wins inside the wolfmux server. prefix I is taken by
# tmux-plugins/tpm on this machine (install_plugins), and binding it here would have
# shadowed it silently. Check before you add one: tmux -L wolfmux list-keys | grep ' N '
#
# And it is not a one-off collision. Upgrading wolfmux on a running server needs
#     tmux -L wolfmux source-file ~/.config/wolfmux/tmux.conf
# which re-sources YOUR config too, re-running tpm and re-applying its prefix I EVERY
# time. A wolfmux binding on I would therefore fight your own plugin manager at every
# upgrade, not just once at server start.
# Defaults worth knowing:
#   prefix <arrow>      move between panes        prefix z   zoom / unzoom a pane
#   prefix Ctrl-<arrow> resize by 1 cell          prefix q   show pane numbers
#   prefix Alt-<arrow>  resize by 5 cells         prefix d   detach (team keeps running)
bind T select-layout

# --- how a key or a status segment finds teamctl (SHARED: every #() and every popup) ---
# tmux runs what a format names through /bin/sh with whatever PATH the SERVER was started
# with, which need not have ~/bin in it. So nothing here says a bare `teamctl`:
#
#     #{?@wolfmux_teamctl,#{@wolfmux_teamctl},teamctl}
#
# `teamctl start` sets @wolfmux_teamctl on the session to teamctl's own absolute path
# (inbox_tag_session, config/wolfmux/lib/inbox.sh), so a team started by this version or
# later needs no PATH at all. Verified on tmux 3.7c: with the option set the format
# expands to its value, unset it expands to the literal.
#
# Where the fallback actually comes from, because it is easy to misread: the `set -g`
# below gives @wolfmux_teamctl the literal word `teamctl` as a GLOBAL value, and a session
# inherits that when it has no value of its own. So for a session started by an older
# teamctl the conditional is still true and resolves to the bare word — a PATH lookup,
# which is what that session had anyway. The `,teamctl}` arm is therefore belt and braces
# for a server with no global either; it is not the mechanism that rescues an old session.
#
# The PROGRAM is quoted, and that is not cosmetic: $TEAMCTL_SELF is an absolute path built
# from `dirname $0`, so a teamctl under `~/My bin/` would split into two words. The badge
# swallows every error by design, so it would simply be blank for ever, and `prefix N`
# would open a popup saying `My: command not found` — the feature silently absent and
# undebuggable. The same reason the root and the team are quoted.
#
# Use this spelling for any new key or status segment; do not write a bare `teamctl`.
set -g @wolfmux_teamctl teamctl

# The notice popup. -d: the team's own repository, so teamctl resolves the right project
# whatever worktree the focused pane sits in. --team: the session's team, so it is right
# even with several teams in one project. A team name is validated (lowercase, digits,
# '-'), so it needs no quoting; the root may hold spaces, and tmux expands a format
# inside one argument, so -d keeps it as one.
bind N display-popup -E -d '#{@wolfmux_root}' -w 90% -h 70% \
  '"#{?@wolfmux_teamctl,#{@wolfmux_teamctl},teamctl}" --team #{@wolfmux_team} inbox --all; printf "\n[press a key to close] "; read -r _'

# prefix O — the dashboard: every team on this machine, across every project, in a popup.
# Read-only; q closes it. -E closes the popup when the command exits.
# --socket is handed over for the same reason the badge gets one: this file knows which
# server it is bound in, and nothing inside the popup can work that out without guessing.
bind O display-popup -E -w 90% -h 80% '#{?@wolfmux_teamctl,#{@wolfmux_teamctl},teamctl} dashboard --socket "#{socket_path}"'

# Status line and terminal-tab title carry the wolf, so a Wolfmux tab stands out among others.
set -g status-style 'bg=colour235,fg=colour248'
#
# The notice badge sits next to the wolf: 📨 and the number of notices nobody has
# expanded yet, plus 🔔 when one of them is a permission request waiting for a decision.
# Nothing at all when the count is zero. teamctl _inbox-badge prints one short line and
# NOTHING on any error, because a badge may never break a status bar; open the notices
# with prefix N. The lead's conversation is never typed into to carry these — that is
# the whole point of the inbox (config/wolfmux/lib/inbox.sh).
set -g status-interval 5
# The root and the team are handed over rather than looked up: tmux expands a nested
# format inside #() before building the shell command (measured on 3.7c), so this costs
# the badge nothing and saves it two tmux round trips per refresh — and, more to the
# point, it stops the badge having to assume which tmux socket it is being drawn on.
# Both are quoted because a repository path may contain a space.
set -g status-left '#[bg=colour214,fg=colour235,bold] 🐺 WOLFMUX #[default] #("#{?@wolfmux_teamctl,#{@wolfmux_teamctl},teamctl}" _inbox-badge "#{session_name}" "#{@wolfmux_root}" "#{@wolfmux_team}") '
set -g status-left-length 48
set -g window-status-current-style 'fg=colour214,bold'
# status-right carries the overview beside the session name: teams, agents running and
# stopped (and exited, when any are), then the machine's load, free memory and free disk.
# `teamctl _overview-badge` prints NOTHING on any error — a badge may never break a status
# bar — and it opens no transcript, runs no ps and runs no du, because this redraws every
# few seconds for every attached client. The full picture is prefix O.
# #{socket_path} is handed over, not looked up: a #() job inherits the SERVER's environment,
# which does not say which socket it is drawn on, so a badge that asked tmux itself would
# silently report the default socket's state instead of this one's.
# In front of it, only when there is something to say, the models word for this session's team:
# how many running agents started on an older model than the newest one known, or before model
# ids were recorded (`teamctl _model-badge`: records and the model cache only, never a network
# call or a transcript; prints nothing on any error). teamctl models says who, and the restart.
set -g status-right '#[fg=colour214]#("#{?@wolfmux_teamctl,#{@wolfmux_teamctl},teamctl}" _model-badge "#{@wolfmux_root}" "#{@wolfmux_team}") #[fg=colour108]#(#{?@wolfmux_teamctl,#{@wolfmux_teamctl},teamctl} _overview-badge "#{socket_path}")#[default] #{session_name} · %H:%M '
set -g status-right-length 160
set -g set-titles on
set -g set-titles-string '🐺 #{session_name}'
