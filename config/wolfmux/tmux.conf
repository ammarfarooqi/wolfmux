# wolfmux tmux configuration
#
# Loaded ONLY by the dedicated team server that teamctl starts:
#     tmux -L wolfmux -f ~/.config/wolfmux/tmux.conf ...
# Your normal tmux server and any ~/.tmux.conf are never modified. Delete this
# file (and ~/bin/teamctl) and nothing of it remains.

# Start from your own tmux configuration, if you ever create one.
if-shell '[ -r ~/.tmux.conf ]' 'source-file ~/.tmux.conf'
if-shell '[ -r ~/.config/tmux/tmux.conf ]' 'source-file ~/.config/tmux/tmux.conf'

# --- what a visible agent team needs -----------------------------------------
set -g mouse on                   # click to focus, drag borders to resize, wheel to scroll
set -g history-limit 100000       # large scrollback per agent
set -g focus-events on
set -sg escape-time 10            # TUIs (Claude Code, Codex) need a fast Escape

# Shift+Enter and friends inside agent TUIs.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm*:RGB'

# Pane titles are agent roles. TUIs may not overwrite them.
# The manager (role "lead") is the wolf: its mark in the title and an amber border,
# focused or not, so you can find it at a glance among any number of workers.
# Every teammate is a dog of the pack.
set -g pane-border-status top
set -g pane-border-format ' #{?#{==:#{@ai_role},lead},#[fg=colour214]🐺 ,#{?#{@ai_role},🐶 ,}}#{?pane_active,#[bold],}#{?#{@ai_role},#{@ai_role} · #{@ai_label},#{pane_title}}#[default]#{?pane_dead, — exited (#{pane_dead_status}),} '
set -g pane-border-style '#{?#{==:#{@ai_role},lead},fg=colour214,fg=colour244}'
set -g pane-active-border-style '#{?#{==:#{@ai_role},lead},fg=colour214,fg=colour39}'
set -g allow-set-title off
set -g allow-rename off
set -wg automatic-rename off

# An agent that exits keeps its pane and final output on screen.
#   teamctl restart <role>   start it again in the same pane
#   teamctl stop <role>      close the pane
set -g remain-on-exit on

# New panes and windows inherit the current pane's directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# One extra key; every tmux default stays as it is.
#   prefix T            put the panes back in the team's arrangement (teamctl layout)
# Defaults worth knowing:
#   prefix <arrow>      move between panes        prefix z   zoom / unzoom a pane
#   prefix Ctrl-<arrow> resize by 1 cell          prefix q   show pane numbers
#   prefix Alt-<arrow>  resize by 5 cells         prefix d   detach (team keeps running)
bind T select-layout

# Status line and terminal-tab title carry the wolf, so a Wolfmux tab stands out among others.
set -g status-style 'bg=colour235,fg=colour248'
set -g status-left '#[bg=colour214,fg=colour235,bold] 🐺 WOLFMUX #[default] '
set -g status-left-length 24
set -g window-status-current-style 'fg=colour214,bold'
set -g status-right ' #{session_name} · %H:%M '
set -g set-titles on
set -g set-titles-string '🐺 #{session_name}'
